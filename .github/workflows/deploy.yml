name: Multi-Server Deploy (VM1 & VM2)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-vm1:
    name: Deploy to VM1
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: VM1에 웹 소스 전체 전송 (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: 129.225.143.163
          REMOTE_USER: webadmin
          TARGET: /var/www/html
          EXCLUDE: "/.git/, /board_uploads/, /uploads/"

  deploy-vm2:
    name: Deploy to VM2
    runs-on: ubuntu-latest
    steps:
      - name: GitHub 소스 코드 가져오기
        uses: actions/checkout@v4

      - name: VM2에 웹 소스 전체 전송 (rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: 129.225.156.63
          REMOTE_USER: webadmin
          TARGET: /var/www/html
          EXCLUDE: "/.git/, /board_uploads/, /uploads/"
