<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Terran vs Zerg - Turn-based Battle</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ffe81f; margin-bottom: 10px; }
        .game-container {
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 8px;
            width: 650px;
            margin: 0 auto;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }
        .status-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .unit-status { text-align: left; }
        .hp-bar { color: #00ff00; font-weight: bold; }
        .boss-hp { color: #ff4444; font-weight: bold; }

        #ascii-screen {
            color: #4af626;
            font-size: 13px;
            line-height: 1.1;
            white-space: pre;
            height: 180px;
            text-align: left;
            margin-left: 20px;
        }

        #log {
            background-color: #111;
            color: #aaa;
            height: 80px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border: 1px solid #222;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .controls button {
            padding: 10px 18px;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            margin: 0 5px;
            font-weight: bold;
            color: white;
        }
        .btn-attack { background: #238636; }
        .btn-attack:hover { background: #2ea043; }
        .btn-skill { background: #1f6beb; }
        .btn-skill:hover { background: #388bfd; }
        .btn-heal { background: #d29922; }
        .btn-heal:hover { background: #e3b341; }

        .back-btn { display: inline-block; margin-top: 25px; color: #8b949e; text-decoration: none; }
        .back-btn:hover { color: #ffffff; }
    </style>
</head>
<body>

    <h1> Terran Boss Battle</h1>
    <p style="color: #8b949e;">STAGE 1 (FINAL): Defeat the Zerg Boss!</p>

    <div class="game-container">
        <!-- ステータス表示 -->
        <div class="status-board">
            <div class="unit-status">
                <div> <b>Terran Marine</b></div>
                <div>HP: <span id="player-hp" class="hp-bar">100 / 100</span></div>
            </div>
            <div class="unit-status">
                <div> <b>Hydralisk Boss</b></div>
                <div>HP: <span id="boss-hp" class="boss-hp">150 / 150</span></div>
            </div>
        </div>

        <!-- ASCII アート画面 -->
        <pre id="ascii-screen"></pre>

        <!-- 戦闘ログ -->
        <div id="log">ボスが出現しました！コマンドを選択してください。</div>

        <!-- アクションボタン -->
        <div class="controls" id="action-btns">
            <button class="btn-attack" onclick="playerTurn('attack')"> 通常攻撃</button>
            <button class="btn-skill" onclick="playerTurn('skill')"> スチームパ ック</button>
            <button class="btn-heal" onclick="playerTurn('heal')"> 応急手当</button>
        </div>
    </div>

    <a href="index.html" class="back-btn"> メインメニューに戻る</a>

    <script>
        let playerHp = 100;
        let bossHp = 150;
        let isGameOver = false;

        const asciiIdle = `
  [Terran Marine]                    [Hydralisk Boss]
      (  o  )                             /\\  /\\
     /|  |  |\\                           (  '  )
    / |  |  | \\                         / \\  / \\
      /=====\\                          /___\\/___\\
      |     |                          (========)
`;

        const asciiAttack = `
  [Terran Marine]                    [Hydralisk Boss]
      (  o  )   *PEW! PEW!*               /\\  /\\
     /|--|===> ===> ===>  (HIT!)         ( > < )
    / |  |                            / \\  / \\
      /=====\\                          /___\\/___\\
`;

        const asciiSkill = `
  [Terran Marine]                    [Hydralisk Boss]
     *( STIMPACK! )*                      /\\  /\\
      ( > o < )   *BANG! BANG! BANG!*    ( > < )
     /|==|=======>  =============>       / \\  / \\
    / |  |                               /___\\/___\\
`;

        const asciiBossAttack = `
  [Terran Marine]                    [Hydralisk Boss]
      ( > < )    *SPIT ACID!*             /\\  /\\
     /|  |  |\\   <=== <=== <===          (  '  )
    / |  |  | \\                         / \\  / \\
`;

        document.getElementById('ascii-screen').innerText = asciiIdle;

        function log(msg) {
            const logBox = document.getElementById('log');
            logBox.innerHTML += `<br>${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateHp() {
            document.getElementById('player-hp').innerText = `${Math.max(0, playerHp)} / 100`;
            document.getElementById('boss-hp').innerText = `${Math.max(0, bossHp)} / 150`;
        }

        function playerTurn(action) {
            if (isGameOver) return;

            if (action === 'attack') {
                const dmg = Math.floor(Math.random() * 10) + 15; // 15~24
                bossHp -= dmg;
                document.getElementById('ascii-screen').innerText = asciiAttack;
                log(` マリーンの攻撃！ ボスに <b style="color:#ff5555">${dmg}</b> のダメージ！`);
            } else if (action === 'skill') {
                const selfDmg = 10;
                const dmg = Math.floor(Math.random() * 15) + 30; // 30~44
                playerHp -= selfDmg;
                bossHp -= dmg;
                document.getElementById('ascii-screen').innerText = asciiSkill;
                log(` スチームパック使用！ (自分のHP -10) ボスに <b style="color:#ff5555">${dmg}</b> の大ダメージ！`);
            } else if (action === 'heal') {
                const heal = Math.floor(Math.random() * 10) + 20; // 20~29
                playerHp = Math.min(100, playerHp + heal);
                document.getElementById('ascii-screen').innerText = asciiIdle;
                log(` メディックの応急手当！ HPが <b style="color:#55ff55">${heal}</b> 回復しました。`);
            }

            updateHp();

            if (bossHp <= 0) {
                log(`<br> <b>VICTORY!</b> ヒドラリスクを撃破しました！`);
                document.getElementById('action-btns').innerHTML = `<button class="btn-attack" onclick="location.reload()"> もう一度プレイ</button>`;
                isGameOver = true;
                return;
            }

            // 敵のターン
            setTimeout(bossTurn, 1000);
        }

        function bossTurn() {
            if (isGameOver) return;

            const dmg = Math.floor(Math.random() * 12) + 12; // 12~23
            playerHp -= dmg;
            document.getElementById('ascii-screen').innerText = asciiBossAttack;
            log(` ヒドラリスクの酸性?攻撃！ マリーンに <b style="color:#ff5555">${dmg}</b> のダメージ！`);

            updateHp();

            if (playerHp <= 0) {
                log(`<br> <b>GAME OVER...</b> マリーンが倒れました。`);
                document.getElementById('action-btns').innerHTML = `<button class="btn-attack" onclick="location.reload()"> リトライ</button>`;
                isGameOver = true;
            } else {
                setTimeout(() => {
                    if (!isGameOver) document.getElementById('ascii-screen').innerText = asciiIdle;
                }, 800);
            }
        }
    </script>
</body>
</html>
