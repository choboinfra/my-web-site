<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <title>MENU suisenki</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 80px; background: #fff5f5; }
        h1 { color: #333; }
        .box { font-size: 2rem; font-weight: bold; color: #ff5722; margin: 30px; }
        button { padding: 12px 25px; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: none; background: #ff5722; color: white; }
        button:hover { background: #e0481d; }
        .back-btn { display: inline-block; margin-top: 40px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <h1> 今日は何食べよう?</h1>
    <div class="box" id="menu">ウラ</div>
    <button onclick="pick()">ヤッハ</button>
    <br>
    <a href="index.html" class="back-btn">戻る</a>

    <script>
        const menus = ["(ラーメン)", "(カレー)", "(やよい軒)", "(食べるな)", "( コンビニ)",  "(モスバーガー)" ];
        function pick() {
            const random = menus[Math.floor(Math.random() * menus.length)];
            document.getElementById('menu').innerText = random;
        }
    </script>
</body>
</html>
